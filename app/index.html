<!doctype html>
<html lang="en" data-theme="iram">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>IRAM Intelligence Terminal</title>

    <!--
      CRITICAL CSS FOR THE BOOT SHELL.

      MEASURED, and this is the whole reason it exists: `#root` was empty, so the
      body had NOTHING to paint until `mountShell` had finished building 1,615
      nodes. First contentful paint landed at 800ms against a document that had
      finished loading at 454ms — a third of a second of blank window after the
      bytes were already there.

      The terminal is one self-contained file by design, so there is no second
      request to wait on and nothing to lazy-load: the fix is not to make the
      boot faster but to have something correct on screen while it happens. This
      is a static skeleton of the real chrome, at the real token heights, so the
      layout does not shift when the app replaces it.

      Duplicated here rather than imported, deliberately. Anything the boot
      shell needs has to be inside the document — a variable read from the main
      stylesheet would resolve, but only once that stylesheet is parsed, which
      is the wait this is trying to avoid.
    -->
    <style>
      :root {
        --boot-base: #0b0e14;
        --boot-panel: #141922;
        --boot-line: #232b38;
      }
      html[data-theme="daylight"] {
        --boot-base: #f6f7f9;
        --boot-panel: #ffffff;
        --boot-line: #dfe3e9;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-base);
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        /* The real tracks, so nothing moves when the app takes over. */
        grid-template-rows: 42px 48px minmax(0, 1fr) 30px;
        background: var(--boot-base);
        z-index: 9999;
      }
      #boot > i {
        display: block;
        border-bottom: 1px solid var(--boot-line);
        background: var(--boot-panel);
      }
      #boot > i:nth-child(3) {
        border-bottom: 0;
        background: var(--boot-base);
      }
      #boot > i:nth-child(4) {
        border-bottom: 0;
        border-top: 1px solid var(--boot-line);
      }

      /*
        NO SHIMMER, ON PURPOSE.

        A pulsing skeleton is the obvious thing to reach for and the wrong call
        here: this is seen on every single launch, and an animation somebody
        meets hundreds of times should not exist. A shimmer would also be a
        claim that something is still arriving, when in truth the bytes have
        landed and the app is mounting. Still geometry is honest and invisible.
      */
      #boot[data-done] {
        opacity: 0;
        pointer-events: none;
        /* ease-out: the reveal should feel instant at its start, where the eye
           is. Short, because this is a hand-off and not an entrance. */
        transition: opacity 150ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        #boot[data-done] {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Four bars: command, context, workspace, status. `<i>` because it is the
      shortest element name that carries no semantics — this is scaffolding, and
      it is `aria-hidden` so a screen reader is never told about a shape that
      stands for nothing.
    -->
    <div id="boot" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
